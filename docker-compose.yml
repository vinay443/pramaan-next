name: pramaan-next

services:
  postgres:
    image: postgres:16
    container_name: pramaan-postgres
    environment:
      POSTGRES_USER: pramaan
      POSTGRES_PASSWORD: pramaan
      POSTGRES_DB: pramaan
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pramaan -d pramaan"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Container starts under start.sh option D but is not currently wired into
  # backend-java (pramaan.ai.vector-store defaults to memory / object store
  # defaults to filesystem). Intentional — see CLAUDE.md decision log.
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pramaan-pgvector
    environment:
      POSTGRES_USER: pramaan
      POSTGRES_PASSWORD: pramaan
      POSTGRES_DB: pramaan_vectors
    ports:
      - "5434:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./infra/pgvector/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pramaan -d pramaan_vectors"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Container starts under start.sh option D but is not currently wired into
  # backend-java (pramaan.ai.vector-store defaults to memory / object store
  # defaults to filesystem). Intentional — see CLAUDE.md decision log.
  minio:
    image: quay.io/minio/minio:latest
    container_name: pramaan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pramaan
      MINIO_ROOT_PASSWORD: pramaan-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Real target for the Aerospike predefined-query controls in LIVE mode
  # (backend-java's AerospikeLiveExecutor). Community Edition, single node,
  # default namespace "test" to match pramaan.aerospike.namespace's default.
  aerospike:
    image: aerospike/aerospike-server:latest
    container_name: pramaan-aerospike
    environment:
      NAMESPACE: test
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "asinfo -v status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Real target for the NGINX predefined-query controls in LIVE mode
  # (backend-java's NginxLiveExecutor). stub_status exposed at /nginx_status
  # for the connection-metrics controls; nginx.conf is bind-mounted so the
  # backend (running on the host, same as the postgres/aerospike executors)
  # can read the exact same live config file directly for the grep-based
  # config-inspection controls. Host-mapped to 8081 — 8080 inside the
  # container (matching nginx.conf's `listen 8080;`) collides with the
  # backend-java app itself, which already owns host port 8080.
  nginx:
    image: nginx:latest
    container_name: pramaan-nginx
    ports:
      - "8081:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/nginx_status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Real target for the Aurora MySQL predefined-query controls in LIVE mode
  # (backend-java's AuroraMysqlLiveExecutor). No official local Aurora image
  # exists — Aurora MySQL is wire/protocol compatible with MySQL, so plain
  # mysql:8.0 stands in for every control answerable via SHOW VARIABLES/STATUS
  # or information_schema/performance_schema. Controls that need real
  # Aurora-managed behavior (replica lag, failover config, storage-level
  # encryption) have no equivalent here — see AuroraMysqlLiveExecutor's Javadoc.
  aurora-mysql:
    image: mysql:8.0
    container_name: pramaan-aurora-mysql
    environment:
      MYSQL_ROOT_PASSWORD: pramaan
      MYSQL_DATABASE: pramaan
    # Host-mapped to 3307 — 3306 is already bound by another MySQL instance on
    # this host; the healthcheck (inside the container) still targets 3306.
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppramaan"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  pgvector-data:
  minio-data:
