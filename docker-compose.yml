name: pramaan-next

services:
  postgres:
    image: postgres:16
    container_name: pramaan-postgres
    environment:
      POSTGRES_USER: pramaan
      POSTGRES_PASSWORD: pramaan
      POSTGRES_DB: pramaan
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pramaan -d pramaan"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Container starts under start.sh option D but is not currently wired into
  # backend-java (pramaan.ai.vector-store defaults to memory / object store
  # defaults to filesystem). Intentional — see CLAUDE.md decision log.
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pramaan-pgvector
    environment:
      POSTGRES_USER: pramaan
      POSTGRES_PASSWORD: pramaan
      POSTGRES_DB: pramaan_vectors
    ports:
      - "5434:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./infra/pgvector/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pramaan -d pramaan_vectors"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Container starts under start.sh option D but is not currently wired into
  # backend-java (pramaan.ai.vector-store defaults to memory / object store
  # defaults to filesystem). Intentional — see CLAUDE.md decision log.
  minio:
    image: quay.io/minio/minio:latest
    container_name: pramaan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pramaan
      MINIO_ROOT_PASSWORD: pramaan-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Real target for the Aerospike predefined-query controls in LIVE mode
  # (backend-java's AerospikeLiveExecutor). Community Edition, single node,
  # default namespace "test" to match pramaan.aerospike.namespace's default.
  aerospike:
    image: aerospike/aerospike-server:latest
    container_name: pramaan-aerospike
    environment:
      NAMESPACE: test
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "asinfo -v status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Real target for the NGINX predefined-query controls in LIVE mode
  # (backend-java's NginxLiveExecutor). stub_status exposed at /nginx_status
  # for the connection-metrics controls; nginx.conf is bind-mounted so the
  # backend (running on the host, same as the postgres/aerospike executors)
  # can read the exact same live config file directly for the grep-based
  # config-inspection controls. Host-mapped to 8081 — 8080 inside the
  # container (matching nginx.conf's `listen 8080;`) collides with the
  # backend-java app itself, which already owns host port 8080.
  nginx:
    image: nginx:latest
    container_name: pramaan-nginx
    ports:
      - "8081:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/nginx_status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Real target for the Aurora MySQL predefined-query controls in LIVE mode
  # (backend-java's AuroraMysqlLiveExecutor). No official local Aurora image
  # exists — Aurora MySQL is wire/protocol compatible with MySQL, so plain
  # mysql:8.0 stands in for every control answerable via SHOW VARIABLES/STATUS
  # or information_schema/performance_schema. Controls that need real
  # Aurora-managed behavior (replica lag, failover config, storage-level
  # encryption) have no equivalent here — see AuroraMysqlLiveExecutor's Javadoc.
  aurora-mysql:
    image: mysql:8.0
    container_name: pramaan-aurora-mysql
    environment:
      MYSQL_ROOT_PASSWORD: pramaan
      MYSQL_DATABASE: pramaan
    # Host-mapped to 3307 — 3306 is already bound by another MySQL instance on
    # this host; the healthcheck (inside the container) still targets 3306.
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppramaan"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Real target for the YugabyteDB predefined-query controls in LIVE mode
  # (backend-java's YugabyteLiveExecutor). Single-node dev cluster via
  # yugabyted; YSQL is PostgreSQL-wire-compatible so no separate driver is
  # needed. Host-mapped to 5435 — 5433/5434 are already used by the
  # postgres/pgvector services above.
  yugabytedb:
    image: yugabytedb/yugabyte:latest
    container_name: pramaan-yugabytedb
    command: ["bin/yugabyted", "start", "--background=false"]
    ports:
      - "5435:5433"
    healthcheck:
      # yugabyted binds YSQL to the container's own bridge IP, not loopback —
      # `-h localhost` inside the container gets connection refused even once
      # YSQL is ready, so resolve the container's own address first.
      test: ["CMD-SHELL", "bin/ysqlsh -h $(hostname -i) -U yugabyte -c 'SELECT 1;'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  # Real target for the Oracle predefined-query controls in LIVE mode
  # (backend-java's OracleLiveExecutor). gvenzl/oracle-free is the lightest
  # official-adjacent Oracle image with a fast startup and its own built-in
  # healthcheck.sh, so the healthcheck below calls that rather than a custom
  # SQL probe. Default free-tier service name FREEPDB1, connects as SYSTEM
  # (see OracleLiveExecutor's Javadoc for the privilege tradeoff).
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: pramaan-oracle
    environment:
      ORACLE_PASSWORD: pramaan
      APP_USER: pramaan
      APP_USER_PASSWORD: pramaan
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Real target for the RHEL predefined-query controls in LIVE mode
  # (backend-java's RhelLiveExecutor). No official RHEL image exists locally —
  # rockylinux:9 stands in (binary-compatible OS/security-posture surface for
  # every control this catalogue currently has) with openssh-server installed
  # and started directly, since the base image has no systemd/PID 1 init.
  # Known limitation from that: the firewalld/auditd controls (RH8/RH9
  # -004/-005) return empty output here rather than a real service-status
  # string — harmless, the catalog commands all end in `|| true`. Host-mapped
  # to 2222 — port 22 isn't available for host binding without root and would
  # collide with the host's own sshd.
  rhel:
    image: rockylinux:9
    container_name: pramaan-rhel
    command: >
      bash -c "
        dnf install -y openssh-server passwd >/dev/null &&
        ssh-keygen -A &&
        echo 'root:pramaan' | chpasswd &&
        sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config &&
        sed -i 's/^#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
        exec /usr/sbin/sshd -D
      "
    ports:
      - "2222:22"
    healthcheck:
      # Reads the actual SSH banner rather than just checking the port is open,
      # so this only reports healthy once sshd itself is accepting connections.
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/tcp/127.0.0.1/22' | grep -q '^SSH-'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  pgvector-data:
  minio-data:
