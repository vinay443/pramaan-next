# Real target for the NGINX predefined-query controls in LIVE mode
# (backend-java's NginxLiveExecutor). Bind-mounted into the `nginx` compose
# service AND read directly from this host path by NginxLiveExecutor
# (pramaan.nginx.config-path) — same file backs both, so a "live" config
# read reflects exactly what the running container is serving.
#
# Representative values only, chosen so the grep-based catalogue controls
# (NGX-003..NGX-007) have something real to find — not meant as a hardened
# baseline.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    server {
        listen 8080;
        server_name localhost;

        # stub_status — polled live by NginxLiveExecutor over HTTP
        # (pramaan.nginx.status-path, default /nginx_status).
        location /nginx_status {
            stub_status;
            allow all;
        }

        location / {
            default_type text/plain;
            return 200 "pramaan-next nginx target\n";
        }
    }
}
