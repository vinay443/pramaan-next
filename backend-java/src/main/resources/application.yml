spring:
  application:
    name: pramaan-next-backend
  datasource:
    url: ${PRAMAAN_DB_URL:jdbc:postgresql://localhost:5433/pramaan?options=-c%20TimeZone%3DAsia/Kolkata}
    username: ${PRAMAAN_DB_USER:pramaan}
    password: ${PRAMAAN_DB_PASSWORD:pramaan}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

pramaan:
  # Object storage abstraction. driver: filesystem | memory | minio (default here —
  # this is the Docker-backed default profile that start.sh's Demo/Low-mem options
  # start the minio container for; the no-Docker 'dev' profile overrides back to
  # filesystem in application-dev.yml).
  object-store:
    driver: ${PRAMAAN_OBJECT_STORE_DRIVER:minio}
    filesystem:
      root: ${PRAMAAN_OBJECT_STORE_ROOT:./data/object-store}
    # Connection for the docker-compose `minio` service (host-mapped ports — this
    # app runs on the host, not inside compose's network). Only used when
    # driver=minio; start.sh's option D sets that driver via a JVM system property,
    # it isn't the global default.
    minio:
      endpoint: ${PRAMAAN_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${PRAMAAN_MINIO_ACCESS_KEY:pramaan}
      secret-key: ${PRAMAAN_MINIO_SECRET_KEY:pramaan-secret}
      bucket: ${PRAMAAN_MINIO_BUCKET:pramaan-evidence}
  integrations:
    # Phase 1 ships mock enterprise integrations only.
    mock-enabled: true
    # Use Case 15 — SharePoint / ServiceNow. Mock by default; base URLs only, never credentials.
    sharepoint:
      mock: ${PRAMAAN_SHAREPOINT_MOCK:true}
      base-url: ${PRAMAAN_SHAREPOINT_SITE_URL:https://contoso.sharepoint.com/sites/compliance}
    servicenow:
      mock: ${PRAMAAN_SERVICENOW_MOCK:true}
      base-url: ${PRAMAAN_SERVICENOW_URL:https://dev00000.service-now.com}
    # Outbound GRC sync target (evidence + control-status summaries). Mock by default.
    grc:
      mock: ${PRAMAAN_GRC_MOCK:true}
      base-url: ${PRAMAAN_GRC_URL:https://grc.example.com/api/ingest}

  # Use Case 12 — configuration-driven multi-application onboarding.
  onboarding:
    catalog: ${PRAMAAN_ONBOARDING_CATALOG:classpath:phase2/onboarding.json}

  # Staged onboarding scan (register app, resolve frameworks/controls, validate
  # sources, trigger baseline collection, compute initial posture).
  onboarding-scan:
    # When true, POST /onboarding/scans immediately dispatches the scan to the async executor.
    dispatch: ${PRAMAAN_ONBOARDING_SCAN_DISPATCH:true}

  # Use Case 13 — evidence lifecycle: retention window for APPROVED evidence.
  evidence:
    retention-days: ${PRAMAAN_EVIDENCE_RETENTION_DAYS:365}
    # App Owner dashboard — Auditor SLA: days from evidence submission to review considered on-time.
    auditor-sla-days: ${PRAMAAN_EVIDENCE_AUDITOR_SLA_DAYS:5}
  # Predefined technical-query catalogue execution. mode: SIMULATED (default) | LIVE.
  # LIVE only executes for real against PostgreSQL (the postgres container already
  # migrated by Flyway); every other technology falls back to simulated output,
  # tagged executionMode=SIMULATED_FALLBACK so it's never mistaken for a real run.
  predefined-queries:
    mode: ${PRAMAAN_PREDEFINED_QUERIES_MODE:SIMULATED}
  # Real target for the Aerospike predefined-query controls in LIVE mode — see
  # docker-compose.yml's `aerospike` service (same default port/namespace).
  aerospike:
    host: ${PRAMAAN_AEROSPIKE_HOST:localhost}
    port: ${PRAMAAN_AEROSPIKE_PORT:3000}
    namespace: ${PRAMAAN_AEROSPIKE_NAMESPACE:test}
  # Real target for the NGINX predefined-query controls in LIVE mode — see
  # docker-compose.yml's `nginx` service (host-mapped to 8081 — 8080 inside the
  # container collides with this app's own server.port). config-path must point
  # at the same file bind-mounted into that container (relative to backend-java/,
  # this app's working directory) so the grep-based controls read the config the
  # server is actually running.
  nginx:
    host: ${PRAMAAN_NGINX_HOST:localhost}
    port: ${PRAMAAN_NGINX_PORT:8081}
    status-path: ${PRAMAAN_NGINX_STATUS_PATH:/nginx_status}
    config-path: ${PRAMAAN_NGINX_CONFIG_PATH:../infra/nginx/nginx.conf}
  # Real target for the Aurora MySQL predefined-query controls in LIVE mode — see
  # docker-compose.yml's `aurora-mysql` service (plain mysql:8.0 standing in for
  # Aurora — no official local Aurora image exists; wire/protocol compatible for
  # every control this catalogue currently has).
  aurora-mysql:
    host: ${PRAMAAN_AURORA_MYSQL_HOST:localhost}
    port: ${PRAMAAN_AURORA_MYSQL_PORT:3307}
    database: ${PRAMAAN_AURORA_MYSQL_DATABASE:pramaan}
    user: ${PRAMAAN_AURORA_MYSQL_USER:root}
    password: ${PRAMAAN_AURORA_MYSQL_PASSWORD:pramaan}
  # Real target for the YugabyteDB predefined-query controls in LIVE mode — see
  # docker-compose.yml's `yugabytedb` service (YSQL is PostgreSQL-wire-compatible,
  # so this reuses org.postgresql, same as PostgresLiveExecutor). Host-mapped to
  # 5435 — 5433/5434 are already used by the postgres/pgvector services.
  yugabytedb:
    host: ${PRAMAAN_YUGABYTEDB_HOST:localhost}
    port: ${PRAMAAN_YUGABYTEDB_PORT:5435}
    database: ${PRAMAAN_YUGABYTEDB_DATABASE:yugabyte}
    user: ${PRAMAAN_YUGABYTEDB_USER:yugabyte}
    password: ${PRAMAAN_YUGABYTEDB_PASSWORD:}
  # Real target for the RHEL predefined-query controls in LIVE mode — see
  # docker-compose.yml's `rhel` service (rockylinux:9 + openssh-server, no
  # systemd/PID 1 init — see that service's comment for the firewalld/auditd
  # control limitation this implies). Host-mapped to 2222 — port 22 isn't
  # available for host binding without root or would collide with the host's
  # own sshd. password has a real default (unlike yugabytedb's blank one)
  # since RHEL has no anonymous/passwordless mode the app should assume;
  # private-key-path is optional and blank by default, for RhelLiveExecutor's
  # key-based auth path.
  rhel:
    host: ${PRAMAAN_RHEL_HOST:localhost}
    port: ${PRAMAAN_RHEL_PORT:2222}
    user: ${PRAMAAN_RHEL_USER:root}
    password: ${PRAMAAN_RHEL_PASSWORD:pramaan}
    private-key-path: ${PRAMAAN_RHEL_PRIVATE_KEY_PATH:}
  # Real target for the Oracle predefined-query controls in LIVE mode — see
  # docker-compose.yml's `oracle` service (gvenzl/oracle-free, service name
  # FREEPDB1 — the image's default pluggable database). Connects as SYSTEM:
  # several controls query dba_*/v$session views that need SELECT_CATALOG_ROLE
  # or DBA privilege, which an ordinary schema user doesn't have by default —
  # SYSTEM has it out of the box on this dev image. Dev/demo-only; a real
  # deployment should use a dedicated read-only user granted SELECT_CATALOG_ROLE
  # instead of SYSTEM. See OracleLiveExecutor's Javadoc.
  oracle:
    host: ${PRAMAAN_ORACLE_HOST:localhost}
    port: ${PRAMAAN_ORACLE_PORT:1521}
    service-name: ${PRAMAAN_ORACLE_SERVICE_NAME:FREEPDB1}
    user: ${PRAMAAN_ORACLE_USER:system}
    password: ${PRAMAAN_ORACLE_PASSWORD:pramaan}
  scheduler:
    # Background @Scheduled trigger. Off by default; runs are normally API-triggered.
    auto-enabled: ${PRAMAAN_SCHEDULER_AUTO:false}
    # When true, POST /scheduler/runs immediately dispatches the run to the async executor.
    dispatch: ${PRAMAAN_SCHEDULER_DISPATCH:true}
    cron: ${PRAMAAN_SCHEDULER_CRON:0 0 * * * *}
    default-sources: MOCK_JIRA,MOCK_SERVICENOW,MOCK_GITHUB,MOCK_CONFLUENCE,SIM_POSTGRES,SIM_MYSQL,SIM_NGINX,SIM_TOMCAT,SHAREPOINT,SERVICENOW
    stale-after-days: 90
  seed:
    # Insert demo applications on startup if the table is empty.
    applications-enabled: ${PRAMAAN_SEED_APPS:true}

  # Dev/demo only. Gates throwaway helpers (e.g. POST /api/v1/dev/seed-demo-evidence).
  # Defaults to false — never enable in production.
  demo-mode: ${DEMO_MODE:false}

  # Use Case 5 — ECS Admin. Canonical role catalogue; the persona registry is
  # in-memory (no credentials stored) and seeded with demo users on startup.
  admin:
    roles: ADMIN,AUDITOR,APP_OWNER,COMPLIANCE_OFFICER,VIEWER

  # Phase 2 AI features (evidence summaries, NL queries, reuse/similarity).
  ai:
    # mode: mock (deterministic, no external calls) | live (call the HTTP model APIs)
    mode: ${PRAMAAN_AI_MODE:mock}
    # vector-store: memory | pgvector (default here — this is the Docker-backed
    # default profile that start.sh's Demo/Low-mem options start the pgvector
    # container for; the no-Docker 'dev' profile overrides back to memory in
    # application-dev.yml).
    vector-store: ${PRAMAAN_AI_VECTOR_STORE:pgvector}
    # Dedicated pgvector container/DB (docker-compose `pgvector` service, host-mapped
    # port — see PgVectorEmbeddingStore). Only connected to when vector-store=pgvector.
    pgvector:
      url: ${PRAMAAN_AI_PGVECTOR_URL:jdbc:postgresql://localhost:5434/pramaan_vectors}
      username: ${PRAMAAN_AI_PGVECTOR_USER:pramaan}
      password: ${PRAMAAN_AI_PGVECTOR_PASSWORD:pramaan}
    chat:
      provider: ${PRAMAAN_AI_CHAT_PROVIDER:openai}   # openai | anthropic
      base-url: ${PRAMAAN_AI_CHAT_BASE_URL:}
      api-key: ${PRAMAAN_AI_CHAT_API_KEY:}
      model: ${PRAMAAN_AI_CHAT_MODEL:gpt-4o-mini}
      timeout-seconds: 30
    embedding:
      provider: ${PRAMAAN_AI_EMBED_PROVIDER:openai}
      base-url: ${PRAMAAN_AI_EMBED_BASE_URL:}
      api-key: ${PRAMAAN_AI_EMBED_API_KEY:}
      model: ${PRAMAAN_AI_EMBED_MODEL:text-embedding-3-small}
      dimension: ${PRAMAAN_AI_EMBED_DIMENSION:256}
