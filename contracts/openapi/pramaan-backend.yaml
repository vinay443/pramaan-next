openapi: 3.1.0
info:
  title: Pramaan Next — Backend (Phase 1)
  version: 0.1.0
  description: >
    Evidence ingestion, versioning, integrity, deterministic repository queries,
    application metadata, and the collection scheduler. Phase 1 uses deterministic
    mock enterprise integrations. No LLM. Source of truth for backend ⇄ frontend
    and backend ⇄ agents interfaces — implement against this file, do not hand-roll.
servers:
  - url: http://localhost:8080
    description: Local dev

tags:
  - name: applications
  - name: frameworks
  - name: controls
  - name: agents
  - name: checks
  - name: evidence
  - name: scheduler
  - name: insight
    description: >
      Phase 2 — evidence completeness, reuse/similarity, deterministic rule-based evidence
      summaries (no AI model), natural-language queries, compliance aggregation. The AI
      features (NL query, audit-prep narrative, similarity) run in a deterministic mock mode
      unless pramaan.ai.mode=live.

paths:
  /api/v1/insight/completeness:
    get:
      tags: [insight]
      summary: Expected-control coverage for one application (deterministic)
      parameters:
        - { name: applicationSlug, in: query, required: true, schema: { type: string } }
        - { name: framework, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CompletenessReport" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/insight/compliance:
    get:
      tags: [insight]
      summary: Compliance posture rollup (check verdicts × expected controls, deterministic)
      parameters:
        - { name: applicationSlug, in: query, required: true, schema: { type: string } }
        - { name: framework, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ComplianceReport" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/insight/leadership:
    get:
      tags: [insight]
      summary: Leadership compliance dashboard — portfolio rollup of actual results across all applications
      parameters:
        - { name: businessUnit, in: query, required: false, description: "Repeatable. Restrict to applications in these business units (case-insensitive); omit for all.", schema: { type: array, items: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LeadershipDashboard" } } } }

  /api/v1/insight/comparison:
    get:
      tags: [insight]
      summary: "UC14 — cross-application compliance comparison (matrix + gap list)"
      parameters:
        - { name: applications, in: query, required: false, schema: { type: array, items: { type: string } } }
        - { name: businessUnit, in: query, required: false, description: "Repeatable. Restrict to applications in these business units (case-insensitive); omit for all.", schema: { type: array, items: { type: string } } }
        - { name: framework, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ComparisonReport" } } } }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/insight/enterprise:
    get:
      tags: [insight]
      deprecated: true
      summary: "UC16 — enterprise compliance dashboard (portfolio + business-unit / criticality cuts + top risks)"
      description: "Deprecated: thin view over GET /api/v1/insight/national/rollup (same data). Responds with `Deprecation: true` and a `Link: rel=successor-version` header."
      parameters:
        - { name: businessUnit, in: query, required: false, description: "Repeatable. Restrict to applications in these business units (case-insensitive); omit for all.", schema: { type: array, items: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EnterpriseDashboard" } } } }

  /api/v1/insight/national:
    get:
      tags: [insight]
      deprecated: true
      summary: "UC20 — national / pan-India compliance dashboard (mock region map)"
      description: "Deprecated: use GET /api/v1/insight/national/rollup, which has the same regions plus the region x framework breakdown, gap ranking and enterprise cuts. Responds with `Deprecation: true` and a `Link: rel=successor-version` header."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NationalDashboard" } } } }

  /api/v1/insight/national/rollup:
    get:
      tags: [insight]
      summary: "Merged national + enterprise compliance dashboard (source of truth)"
      description: "Regions with RAG, regions ranked by gap to the national average, region x framework breakdown, portfolio, business-unit / criticality cuts and top risks (critical apps first, then lowest compliance)."
      parameters:
        - { name: businessUnit, in: query, required: false, description: "Repeatable. Restrict every part to applications in these business units (case-insensitive); omit for all.", schema: { type: array, items: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NationalRollup" } } } }

  /api/v1/insight/audit-prep:
    get:
      tags: [insight]
      summary: "UC18 — AI-assisted audit-preparation checklist (deterministic findings + grounded narrative)"
      parameters:
        - { name: applicationSlug, in: query, required: false, schema: { type: string } }
        - { name: framework, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPrepReport" } } } }

  /api/v1/insight/trend:
    get:
      tags: [insight]
      summary: "UC19 — compliance trend (snapshots) + closure metrics + collection throughput"
      parameters:
        - name: businessUnit
          in: query
          required: false
          description: Repeatable. Scope points and `current` to one or more business units (a function or a vertical; points sum across them). Evidence/integrity metrics, closure and collection are not tracked per application and come back zeroed/empty when scoped. Mutually exclusive with `applicationSlug`.
          schema: { type: array, items: { type: string } }
        - name: applicationSlug
          in: query
          required: false
          description: Scope just `closure` (approvals/rejections/avgDaysToApprove/rejectionTrendPct) to one application's evidence lifecycle events — App Owner dashboard Overview. `current`/`points` stay portfolio-wide. Mutually exclusive with `businessUnit`.
          schema: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TrendReport" } } } }
  /api/v1/insight/trend/snapshot:
    post:
      tags: [insight]
      summary: Take a compliance-posture snapshot now (re-runs the portfolio rollup)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TrendPoint" } } } }

  /api/v1/insight/evidence-lifecycle/summary:
    get:
      tags: [insight]
      summary: "App Owner dashboard — evidence lifecycle counts, rejection audit trail, Auditor SLA, pending aging, scoped to one application"
      parameters:
        - { name: applicationSlug, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceLifecycleSummary" } } } }

  /api/v1/reports:
    get:
      tags: [reports]
      summary: "UC17 — regulatory report catalogue (compliance-summary, evidence-register, gap-report, audit-readiness, pan-india, regulatory-filing, evidence-summary)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReportInfo" } }
  /api/v1/reports/{name}:
    parameters: [ { name: name, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [reports]
      summary: "Render a report as JSON (default) or CSV — a view over existing insight/evidence data"
      description: >-
        Report `evidence-summary` ("Evidence summary — audit documentation", filters applicationSlug and framework) is the
        per-control roll-up of the deterministic evidence summaries: see the EvidenceSummaryReport schema. Its CSV has one row
        per evidence item and one row per control with no evidence (blank evidence columns); cells starting with = + - @ are
        prefixed with a single quote. It renders at most 2,000 evidence records and sets truncated=true beyond that.
      parameters:
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
        - { name: applicationSlug, in: query, required: false, schema: { type: string } }
        - { name: framework, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - { type: object }
                  - { type: array, items: { type: object } }
                  - { $ref: "#/components/schemas/EvidenceSummaryReport" }
            text/csv: { schema: { type: string } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/insight/evidence/{id}/summary:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: version
        in: query
        required: false
        description: Evidence version number to summarise; defaults to the current version. An unknown version is a 404.
        schema: { type: integer, minimum: 1 }
    get:
      tags: [insight]
      summary: >-
        Deterministic, rule-based summary of one evidence version — facts extracted from the stored bytes,
        the persisted check verdicts, the evidence metadata and the control library, rendered through fixed
        templates. No AI model is involved; a GET never writes.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceSummary" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/insight/reuse/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: limit, in: query, schema: { type: integer, default: 5 } }
      - { name: minScore, in: query, schema: { type: number, default: 0.3 } }
    get:
      tags: [insight]
      summary: Evidence similar to the given record (embedding nearest-neighbour + reuse hints)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReuseResult" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/insight/reuse/search:
    post:
      tags: [insight]
      summary: Evidence similar to a free-text query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                limit: { type: integer, default: 5 }
                minScore: { type: number, default: 0.3 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReuseResult" } } } }

  /api/v1/insight/nl-query:
    post:
      tags: [insight]
      summary: Natural-language audit query — deterministic routing for structured questions, RAG (embedding/pgvector retrieval, cited + grounded) for "what evidence do we have for X", AI narration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
                applicationSlug: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NlQueryResult" } } } }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/insight/embeddings/reindex:
    post:
      tags: [insight]
      summary: Rebuild evidence embeddings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { indexed: { type: integer } } }

  /api/v1/frameworks:
    get:
      tags: [frameworks]
      summary: List compliance frameworks (reference data)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FrameworkView" } }

  /api/v1/controls:
    get:
      tags: [controls]
      summary: List controls (reference catalog)
      parameters:
        - { name: framework, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ControlView" } }

  /api/v1/controls/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [controls]
      summary: Get one control
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ControlView" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/agents:
    get:
      tags: [agents]
      summary: List registered collection agents
      parameters:
        - { name: applicationSlug, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AgentDescriptorView" } }

  /api/v1/agents/{agentId}:
    parameters: [ { name: agentId, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [agents]
      summary: Get one agent descriptor (identity + checks it can run)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentDescriptorView" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/checks:
    get:
      tags: [checks]
      summary: List predefined technical checks (collector catalog)
      parameters:
        - { name: collector, in: query, schema: { type: string } }
        - { name: framework, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CheckDefView" } }

  /api/v1/checks/evaluate:
    post:
      tags: [checks]
      summary: Re-run deterministic rule evaluation over stored evidence (optionally narrowed)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                applicationSlug: { type: string }
                framework: { type: string }
                controlId: { type: string }
                sourceSystem: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluatedAt: { type: string, format: date-time }
                  evidenceEvaluated: { type: integer }
                  resultsWritten: { type: integer }
                  byStatus: { type: object, additionalProperties: { type: integer } }

  /api/v1/check-results:
    get:
      tags: [checks]
      summary: Deterministic technical-check results (PASS / WARNING / FAIL / NOT_APPLICABLE)
      parameters:
        - { name: applicationSlug, in: query, schema: { type: string } }
        - { name: framework, in: query, schema: { type: string } }
        - { name: controlId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CheckStatus" } }
        - { name: runId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 500 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/CheckResultView" } }

  /api/v1/applications:
    get:
      tags: [applications]
      summary: List applications (metadata)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationView" }
    post:
      tags: [applications]
      summary: Create or replace an application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationUpsert" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationView" } } } }

  /api/v1/applications/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,118}$" }
    get:
      tags: [applications]
      summary: Get one application
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationView" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [applications]
      summary: Update an application (slug in path and body must match)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationUpsert" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationView" } } } }

  /api/v1/onboarding/plan:
    get:
      tags: [applications]
      summary: "Use Case 12 — what the configuration-driven onboarding catalogue would do (no writes)"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingPlan" } } } }

  /api/v1/onboarding/apply:
    post:
      tags: [applications]
      summary: "Apply the onboarding catalogue (idempotent upsert via the application store)"
      parameters:
        - { name: collect, in: query, required: false, schema: { type: boolean, default: false },
            description: "also start one initial scheduler collection run over the catalogued sources" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingResult" } } } }

  /api/v1/evidence/ingest:
    post:
      tags: [evidence]
      summary: Ingest a single evidence item (SHA-256 dedup, immutable versioning)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IngestRequest" } } }
      responses:
        "201": { description: Ingested, content: { application/json: { schema: { $ref: "#/components/schemas/IngestResult" } } } }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/evidence/bulk:
    post:
      tags: [evidence]
      summary: Bulk ingest (JSON array). Per-item outcomes; partial success allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/IngestRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BulkIngestResponse" } } } }

  /api/v1/evidence/bulk/upload:
    post:
      tags: [evidence]
      summary: Bulk upload files — each file becomes one evidence item
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [applicationSlug, framework, controlId, files]
              properties:
                applicationSlug: { type: string }
                framework: { type: string }
                controlId: { type: string }
                sourceSystem: { type: string, default: BULK_UPLOAD }
                collectedBy: { type: string }
                technology: { type: string, description: "optional; sets the canonical technology tag. Falls back to source-system inference when omitted." }
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BulkIngestResponse" } } } }

  /api/v1/evidence/dashboard:
    get:
      tags: [evidence]
      summary: Consolidated evidence dashboard + repository-wide SHA-256 integrity check
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceDashboard" } } } }

  /api/v1/evidence:
    get:
      tags: [evidence]
      summary: Deterministic filtered evidence query (stable ordering)
      parameters:
        - { name: applicationSlug, in: query, schema: { type: string } }
        - { name: framework, in: query, schema: { type: string } }
        - { name: controlId, in: query, schema: { type: string } }
        - { name: sourceSystem, in: query, schema: { type: string } }
        - { name: collectedAfter, in: query, schema: { type: string, format: date-time } }
        - { name: collectedBefore, in: query, schema: { type: string, format: date-time } }
        - { name: tag, in: query, description: "key or key:value", schema: { type: string } }
        - { name: technology, in: query, description: "canonical technology tag facet (e.g. postgresql)", schema: { type: string } }
        - { name: collectionMethod, in: query, description: "canonical collectionMethod tag facet (scheduled | manual | bulk | on-demand)", schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 500 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/EvidenceView" }

  /api/v1/evidence/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [evidence]
      summary: Get one evidence record with its current version
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceView" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/evidence/{id}/content:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: version, in: query, required: false, description: "Version number; defaults to the latest", schema: { type: integer } }
    get:
      tags: [evidence]
      summary: "UC01-FT003 — download the stored bytes of an evidence version (attachment)"
      responses:
        "200":
          description: The evidence content, with its stored Content-Type and a Content-Disposition attachment filename
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/evidence/{id}/lifecycle:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [evidence]
      summary: "Use Case 13 — evidence lifecycle state, retention/expiry and the transition audit trail"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceLifecycleView" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [evidence]
      summary: "Transition evidence lifecycle state (SUBMIT | APPROVE | REJECT | RETIRE | RESET)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [SUBMIT, APPROVE, REJECT, RETIRE, RESET] }
                actor: { type: string }
                note: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceLifecycleView" } } } }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/evidence/{id}/versions:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [evidence]
      summary: List all versions of an evidence record
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EvidenceVersionView" } }

  /api/v1/evidence/{id}/versions/{version}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    get:
      tags: [evidence]
      summary: Get one version
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceVersionView" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/evidence/{id}/verify:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: version, in: query, required: false, schema: { type: integer } }
    get:
      tags: [evidence]
      summary: Recompute SHA-256 from the object store and compare
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrityReport" } } } }

  /api/v1/evidence/query/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          enum: [source-breakdown, stale-evidence, latest-per-control, duplicates, freshness]
      - { name: applicationSlug, in: query, schema: { type: string } }
      - { name: framework, in: query, schema: { type: string } }
      - { name: controlId, in: query, schema: { type: string } }
      - { name: sourceSystem, in: query, schema: { type: string } }
    get:
      tags: [evidence]
      summary: Named deterministic query — structured answer plus rows and counts
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeterministicQueryResult" } } } }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/scheduler/sources:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    get:
      tags: [scheduler]
      summary: List registered integration source systems
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: string } } } } }

  /api/v1/scheduler/runs:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    post:
      tags: [scheduler]
      summary: Start a collection run (async). Empty body = all apps + default sources.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/RunRequest" } } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/RunView" } } } }
    get:
      tags: [scheduler]
      summary: List runs (newest first)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/RunView" } }

  /api/v1/scheduler/runs/{runId}:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" }, { name: runId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [scheduler]
      summary: Run status / progress
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunView" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/scheduler/runs/{runId}/retry:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" }, { name: runId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [scheduler]
      summary: Re-run a finished run with the same parameters
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/RunView" } } } }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/schedules/options:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    get:
      tags: [scheduler]
      summary: Choices for the Create-schedule form (sources, onboarded applications, evidence types, frequencies)
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleOptions" } } } }

  /api/v1/schedules:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    post:
      tags: [scheduler]
      summary: Create a scheduled collection job (created ACTIVE; nextRunAt computed from frequency)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateScheduleRequest" } } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleView" } } } }
        "400": { $ref: "#/components/responses/Error" }
    get:
      tags: [scheduler]
      summary: List scheduled collection jobs (newest first)
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ScheduleView" } } } } }

  /api/v1/schedules/{id}:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    patch:
      tags: [scheduler]
      summary: >-
        Activate / deactivate a job (activating recomputes nextRunAt; deactivating clears it). Optional version = the
        ScheduleView.version the caller saw: if it is stale the answer is 409 CONFLICT. Without it a concurrent write is
        retried, and setting the value already in place is a no-op.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [active], properties: { active: { type: boolean }, version: { type: integer, format: int64 } } } } }
      responses:
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleView" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/schedules/{id}/run-now:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [scheduler]
      summary: >-
        Run a schedule's collection now (trigger=SCHEDULED, limited to its source/application; sets lastRunAt, leaves nextRunAt).
        If the schedule already has a PENDING/RUNNING run (also against a simultaneous request or the tick) nothing is started:
        409 RUN_IN_PROGRESS with the active runId.
      responses:
        "409":
          description: Schedule already has a run in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [RUN_IN_PROGRESS] }
                  message: { type: string }
                  runId: { type: string, format: uuid }
        "403": { $ref: "#/components/responses/Forbidden" }
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/RunView" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/sources/connections:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    get:
      tags: [scheduler]
      summary: Simulated credential state of every source (absent = VALID)
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SourceConnectionView" } } } } }

  /api/v1/sources/{sourceSystem}/connection:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" }, { name: sourceSystem, in: path, required: true, schema: { type: string } } ]
    put:
      tags: [scheduler]
      summary: Set a source's simulated credential state. INVALID -> runs fail AUTH_FAILED; DISABLED -> CONNECTION_DISABLED; the source is not polled.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [VALID, INVALID, DISABLED] }, updatedBy: { type: string } } } } }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SourceConnectionView" } } } }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/system/status:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    get:
      tags: [scheduler]
      summary: Backend instance status for restart checks (start time of this process, active schedule count)
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverStartedAt: { type: string, format: date-time }
                  now: { type: string, format: date-time }
                  activeSchedules: { type: integer, format: int64 }
                  slaSeconds: { type: integer, description: "Configured run SLA in seconds" }

  # ---- Retention policy & archival (UC01-FT017) — archival only changes lifecycle state; objects, hashes and versions are untouched ----
  /api/v1/retention/policy:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    get:
      tags: [evidence]
      summary: Current retention policy (the configured default, 365 days, until one is saved). All roles.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RetentionPolicy" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [evidence]
      summary: >-
        Set retentionDays (integer 0-3650; anything else is 400 + INPUT_REJECTED). Evidence expiry everywhere is
        collectedAt + retentionDays. Optional version = the one last read; a stale value is 409 CONFLICT. ADMIN only.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [retentionDays], properties: { retentionDays: { type: integer, minimum: 0, maximum: 3650 }, version: { type: integer, format: int64 } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RetentionPolicy" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/retention/archive:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    post:
      tags: [evidence]
      summary: >-
        Archival workflow. Eligible = collectedAt + retentionDays <= now and not already ARCHIVED (optionally for one
        application). PREVIEW changes nothing and lists them. EXECUTE moves each to the terminal ARCHIVED state with an
        ARCHIVED audit event (actor X-Pramaan-User, note 'retention <n>d elapsed (policy)') and sets archivedAt; nothing is
        deleted or modified in storage, and repeating EXECUTE archives 0. ADMIN only. Every call is recorded as a retention run.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [PREVIEW, EXECUTE] }, application: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/retention/runs:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    get:
      tags: [evidence]
      summary: Retention runs (PREVIEW and EXECUTE calls), newest first. All roles.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RetentionRun" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---- Dashboard KPIs (UC01-FT016) — computed from stored data only; metrics that cannot be computed are null ----
  /api/v1/dashboard/kpis:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    get:
      tags: [insight]
      summary: >-
        Filterable KPI snapshot for the App Owner dashboard. evidence.total is exactly the repository search total for the
        same application / framework / collectionMethod / from-to (by evidence collection time), and the per-state counts
        sum to it. automated.* aggregates scheduler runs (filtered by covered application / framework, trigger for
        collectionMethod scheduled|manual|bulk, and run creation time), active schedules, open observations and the
        caller role's unread notifications. on-demand / predefined-query evidence never comes from a scheduler run, so
        those methods report zero runs.
      parameters:
        - { name: application, in: query, schema: { type: string } }
        - { name: framework, in: query, schema: { type: string } }
        - { name: collectionMethod, in: query, schema: { type: string, enum: [scheduled, manual, bulk, on-demand, predefined-query] } }
        - { name: from, in: query, description: "yyyy-MM-dd (start of day) or ISO instant", schema: { type: string } }
        - { name: to, in: query, description: "yyyy-MM-dd (inclusive, through end of day) or ISO instant", schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardKpis" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---- Audit observations (UC01-FT014 follow-up) — linked to evidence + control; AUDITOR/ADMIN write, all roles read ----
  /api/v1/evidence/{evidenceId}/observations:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" }, { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [evidence]
      summary: >-
        Raise an observation on an evidence record. controlId / framework / application are copied from the evidence.
        AUDITOR and ADMIN only (403 + ACCESS_DENIED event otherwise). text 1-1000 chars without < > " ' ` & ; or control
        characters (400 + INPUT_REJECTED). Non-UUID id -> 400 INVALID_IDENTIFIER; unknown id -> 404.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, minLength: 1, maxLength: 1000 } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ObservationView" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      tags: [evidence]
      summary: Observations on one evidence record, newest first. All six roles.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ObservationView" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/observations/{id}/close:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [evidence]
      summary: Close an observation (sets closedAt; idempotent). AUDITOR and ADMIN only.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ObservationView" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/observations:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    get:
      tags: [evidence]
      summary: Search observations, newest first. All six roles.
      parameters:
        - { name: application, in: query, schema: { type: string } }
        - { name: framework, in: query, schema: { type: string } }
        - { name: control, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CLOSED] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ObservationView" } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---- Security events (UC01-FT012) — every blocked request is recorded; no bodies or credentials are stored ----
  /api/v1/security/events:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    get:
      tags: [scheduler]
      summary: >-
        Blocked-request audit trail, newest first. ADMIN and AUDITOR only; any other role gets 403 and that denial
        is itself recorded (ACCESS_DENIED). Recorded events: ACCESS_DENIED (known role not permitted), UNKNOWN_ROLE
        (missing/unknown X-Pramaan-Role), INPUT_REJECTED (name/source/application/evidenceType and run-request
        fields must be 1-100 chars without < > " ' ` & ; or control characters; X-Pramaan-User only [A-Za-z0-9 ._@-],
        max 64), INVALID_IDENTIFIER (id path variable that is not a UUID -> 400; an unknown but well-formed id is a
        plain 404 and not recorded). Stored values are control-character-stripped and truncated to 300 chars.
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [ACCESS_DENIED, UNKNOWN_ROLE, INPUT_REJECTED, INVALID_IDENTIFIER] } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SecurityEventView" } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---- Run notifications (UC01-FT011) — email delivery is simulated, no SMTP/broker ----
  /api/v1/notifications:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    get:
      tags: [scheduler]
      summary: Notifications addressed to the caller's role (X-Pramaan-Role), newest first, with unreadCount (in-app unread)
      parameters:
        - { name: unreadOnly, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationList" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/notifications/{id}/read:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [scheduler]
      summary: Mark one of the caller role's notifications read (404 if it belongs to another role). Allowed for all roles.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationView" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/notifications/read-all:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    post:
      tags: [scheduler]
      summary: Mark all of the caller role's notifications read. Allowed for all roles.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationList" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/notifications/settings:
    parameters: [ { $ref: "#/components/parameters/PramaanRole" } ]
    get:
      tags: [scheduler]
      summary: Notification settings (defaults apply until saved). Readable by all roles.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationSettings" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [scheduler]
      summary: >-
        Save notification settings. APP and ADMIN only. Optional version = the one last read; a stale value is a 409
        CONFLICT, without it concurrent saves are applied one after the other.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NotificationSettings" } } }
      responses:
        "409": { $ref: "#/components/responses/Conflict" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationSettings" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---- Use Case 1 — evidence detail context -----------------------------
  /api/v1/insight/evidence/{id}/context:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [insight]
      summary: Source technology, collection method, controls satisfied and frameworks for one evidence record
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceContext" } } } }
        "404": { $ref: "#/components/responses/Error" }

  # ---- Use Case 5 — ECS Admin (users, roles, applications) --------------
  # Applications are administered via /api/v1/applications (above) — not duplicated here.
  /api/v1/admin/roles:
    get:
      tags: [admin]
      summary: Canonical role catalogue (read-only)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RoleView" } } } } }
  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: List admin personas (no credentials stored)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminUserView" } } } } }
    post:
      tags: [admin]
      summary: Create or replace a persona
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserUpsert" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserView" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{username}:
    parameters: [ { name: username, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [admin]
      summary: Get one persona
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserView" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [admin]
      summary: Update a persona (username in path and body must match)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserUpsert" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserView" } } } }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Remove a persona
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{username}/active:
    parameters: [ { name: username, in: path, required: true, schema: { type: string } } ]
    put:
      tags: [admin]
      summary: Enable or disable a persona
      parameters: [ { name: value, in: query, required: true, schema: { type: boolean } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserView" } } } }
        "404": { $ref: "#/components/responses/Error" }

components:
  parameters:
    PramaanRole:
      name: X-Pramaan-Role
      in: header
      required: true
      description: >-
        Persona code picked at login (APP, AUDITOR, FH, VH, CIO, ADMIN). Demo-mode authorization only, not authentication.
        Scheduler endpoints (schedules, scheduler runs, source connections, system status): GET needs any known role;
        every other method needs APP or ADMIN. A missing or unknown role gets 403 everywhere. Optional X-Pramaan-User
        records the acting user on runs.
      schema: { type: string, enum: [APP, AUDITOR, FH, VH, CIO, ADMIN] }
  responses:
    Conflict:
      description: 'Changed by another user. Body: { error: CONFLICT, message: "Changed by another user, reload and retry" }'
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, enum: [CONFLICT] }
              message: { type: string }
    Forbidden:
      description: 'Role not permitted, or unknown/missing X-Pramaan-Role. Body: { error: FORBIDDEN, message }'
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, enum: [FORBIDDEN] }
              message: { type: string }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    ErrorBody:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }

    Page:
      type: object
      properties:
        items: { type: array, items: {} }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }

    RoleView:
      type: object
      properties:
        id: { type: string }
        description: { type: string }

    AdminUserUpsert:
      type: object
      required: [username, displayName, roles]
      properties:
        username: { type: string, pattern: "[a-z0-9][a-z0-9._-]{1,63}" }
        displayName: { type: string }
        email: { type: string, format: email, nullable: true }
        roles: { type: array, items: { type: string } }
        active: { type: boolean, nullable: true }

    AdminUserView:
      type: object
      properties:
        username: { type: string }
        displayName: { type: string }
        email: { type: string, nullable: true }
        roles: { type: array, items: { type: string } }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ApplicationUpsert:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,118}$" }
        name: { type: string }
        businessUnit: { type: string }
        criticality: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        owner: { type: string }
        technology: { type: array, items: { type: string } }

    ApplicationView:
      allOf:
        - $ref: "#/components/schemas/ApplicationUpsert"
        - type: object
          properties:
            autoCreated: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    IngestRequest:
      type: object
      required: [applicationSlug, controlId, framework, sourceSystem]
      description: Exactly one of contentBase64 / contentText is required.
      properties:
        applicationSlug: { type: string }
        controlId: { type: string }
        framework: { type: string }
        sourceSystem: { type: string }
        sourceObjectId: { type: string }
        title: { type: string }
        contentType: { type: string }
        contentBase64: { type: string }
        contentText: { type: string }
        collectedAt: { type: string, format: date-time }
        collectedBy: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        tags: { type: object, additionalProperties: { type: string } }

    IngestResult:
      type: object
      properties:
        evidenceId: { type: string, format: uuid }
        evidenceKey: { type: string }
        applicationSlug: { type: string }
        controlId: { type: string }
        framework: { type: string }
        sourceSystem: { type: string }
        outcome: { type: string, enum: [CREATED, NEW_VERSION, DUPLICATE] }
        version: { type: integer }
        sha256: { type: string }
        sizeBytes: { type: integer, format: int64 }

    BulkIngestResponse:
      type: object
      properties:
        received: { type: integer }
        created: { type: integer }
        newVersions: { type: integer }
        duplicates: { type: integer }
        failed: { type: integer }
        results: { type: array, items: { $ref: "#/components/schemas/IngestResult" } }
        errors:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { type: string }

    EvidenceVersionView:
      type: object
      properties:
        version: { type: integer }
        sha256: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        objectKey: { type: string }
        collectedAt: { type: string, format: date-time }
        collectedBy: { type: string }
        ingestionRunId: { type: string, format: uuid, nullable: true }
        metadata: { type: object, additionalProperties: { type: string } }

    EvidenceView:
      type: object
      properties:
        evidenceId: { type: string, format: uuid }
        evidenceKey: { type: string }
        applicationSlug: { type: string }
        controlId: { type: string }
        framework: { type: string }
        sourceSystem: { type: string }
        sourceObjectId: { type: string, nullable: true }
        title: { type: string, nullable: true }
        currentVersion: { type: integer }
        lifecycleState: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, EXPIRED, SUPERSEDED, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        tags: { type: object, additionalProperties: { type: string } }
        latest: { $ref: "#/components/schemas/EvidenceVersionView" }

    EvidenceLifecycleView:
      type: object
      properties:
        evidenceId: { type: string, format: uuid }
        applicationSlug: { type: string }
        controlId: { type: string }
        state: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, EXPIRED, SUPERSEDED, ARCHIVED] }
        effectiveState: { type: string, description: "state, except APPROVED past retention reads as EXPIRED" }
        expired: { type: boolean }
        reviewedBy: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
        retentionDays: { type: integer }
        ageDays: { type: integer, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        currentVersion: { type: integer }
        archivedAt: { type: string, format: date-time, nullable: true, description: "Set only while the state is ARCHIVED" }
        history:
          type: array
          items:
            type: object
            properties:
              fromState: { type: string, nullable: true }
              toState: { type: string }
              action: { type: string }
              actor: { type: string, nullable: true }
              note: { type: string, nullable: true }
              occurredAt: { type: string, format: date-time }

    OnboardingPlan:
      type: object
      properties:
        total: { type: integer }
        toCreate: { type: integer }
        existing: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              name: { type: string }
              criticality: { type: string }
              frameworks: { type: array, items: { type: string } }
              sources: { type: array, items: { type: string } }
              unknownSources: { type: array, items: { type: string } }
              status: { type: string, enum: [NEW, EXISTS] }

    OnboardingResult:
      type: object
      properties:
        applied: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        slugs: { type: array, items: { type: string } }
        collectionRunId: { type: string, nullable: true }

    IntegrityReport:
      type: object
      properties:
        evidenceId: { type: string, format: uuid }
        version: { type: integer }
        expectedSha256: { type: string }
        actualSha256: { type: string, nullable: true }
        intact: { type: boolean }
        detail: { type: string }

    EvidenceDashboard:
      type: object
      description: Use Case 4 — one authoritative snapshot of the persisted evidence repository.
      properties:
        generatedAt: { type: string, format: date-time }
        records: { type: integer, format: int64 }
        versions: { type: integer, format: int64 }
        applications: { type: integer }
        frameworks: { type: integer }
        sources: { type: integer }
        staleAfterDays: { type: integer }
        freshness:
          type: object
          properties:
            fresh: { type: integer }
            aging: { type: integer }
            stale: { type: integer }
            unknown: { type: integer }
        integrity:
          type: object
          description: SHA-256 recomputed from the object store for the current version of every record.
          properties:
            checked: { type: integer }
            intact: { type: integer }
            mismatch: { type: integer }
            missingObject: { type: integer }
        duplicateHashes: { type: integer }
        bySource:
          type: array
          items: { type: object, additionalProperties: true }

    DeterministicQueryResult:
      type: object
      properties:
        name: { type: string }
        answerText: { type: string }
        generatedAt: { type: string, format: date-time }
        counts: { type: object, additionalProperties: true }
        rows:
          type: array
          items: { type: object, additionalProperties: true }

    FrameworkView:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }

    ControlView:
      type: object
      properties:
        id: { type: string }
        framework: { type: string }
        title: { type: string }
        domain: { type: string }

    CheckDefView:
      type: object
      description: One predefined technical check an agent collector can run.
      properties:
        checkId: { type: string }
        collector: { type: string, description: "os | database | middleware | tls" }
        technology: { type: string }
        controlId: { type: string }
        framework: { type: string }
        title: { type: string }

    AgentDescriptorView:
      type: object
      properties:
        agentId: { type: string }
        agentName: { type: string }
        host: { type: string }
        environment: { type: string }
        simulation: { type: boolean }
        collectors: { type: array, items: { type: string } }
        checks: { type: array, items: { $ref: "#/components/schemas/CheckDefView" } }

    CheckStatus:
      type: string
      enum: [PASS, WARNING, FAIL, NOT_APPLICABLE]

    CheckResultView:
      type: object
      properties:
        id: { type: string }
        runId: { type: string, format: uuid, nullable: true }
        agentId: { type: string, nullable: true }
        assetId: { type: string, nullable: true }
        applicationSlug: { type: string }
        checkId: { type: string }
        controlId: { type: string }
        framework: { type: string }
        status: { $ref: "#/components/schemas/CheckStatus" }
        observed: { type: string }
        expected: { type: string }
        detail: { type: string }
        evidenceId: { type: string, format: uuid, nullable: true }
        collectedAt: { type: string, format: date-time }

    ControlCoverage:
      type: object
      properties:
        framework: { type: string }
        controlId: { type: string }
        title: { type: string }
        coverage: { type: string, enum: [COVERED, STALE, MISSING] }
        evidenceId: { type: string, format: uuid, nullable: true }
        currentVersion: { type: integer, nullable: true }
        lastCollectedAt: { type: string, format: date-time, nullable: true }
        ageDays: { type: integer, nullable: true }

    CompletenessReport:
      type: object
      properties:
        applicationSlug: { type: string }
        framework: { type: string, nullable: true }
        generatedAt: { type: string, format: date-time }
        staleAfterDays: { type: integer }
        expected: { type: integer }
        covered: { type: integer }
        stale: { type: integer }
        missing: { type: integer }
        completenessPct: { type: number }
        controls: { type: array, items: { $ref: "#/components/schemas/ControlCoverage" } }

    SimilarEvidence:
      type: object
      properties:
        evidenceId: { type: string, format: uuid }
        applicationSlug: { type: string }
        framework: { type: string }
        controlId: { type: string }
        sha256: { type: string, nullable: true }
        score: { type: number }
        crossApplication: { type: boolean }
        sameControl: { type: boolean }
        exactDuplicate: { type: boolean, description: "byte-identical (same SHA-256) as the query evidence" }
        reuseHint: { type: string }

    ReuseResult:
      type: object
      properties:
        queryEvidenceId: { type: string, format: uuid, nullable: true }
        queryText: { type: string, nullable: true }
        embeddingModel: { type: string }
        vectorStore: { type: string, enum: [memory, pgvector] }
        indexed: { type: integer }
        querySha256: { type: string, nullable: true }
        exactDuplicates:
          type: array
          description: Other persisted records whose current version has the identical SHA-256.
          items: { $ref: "#/components/schemas/SimilarEvidence" }
        matches: { type: array, items: { $ref: "#/components/schemas/SimilarEvidence" } }

    EvidenceSummary:
      type: object
      description: >-
        Deterministic summary of one evidence version. Every sentence is a fixed template filled with facts
        from the stored content, its persisted check verdicts, its metadata or the control library.
        model, modelGenerated, summary and groundedOn are kept for backward compatibility.
      required: [evidenceId, method, version, sha256, contentKind, verdict, headline, control, checks, facts, findings, health, limits]
      properties:
        evidenceId: { type: string, format: uuid }
        applicationSlug: { type: string }
        framework: { type: string }
        controlId: { type: string }
        model: { type: string, enum: ["deterministic-rules/v1"], description: "Always deterministic-rules/v1." }
        simulated: { type: boolean, description: "True iff the evidence version's metadata says simulated=true." }
        modelGenerated: { type: boolean, enum: [false], description: "Always false; kept for backward compatibility." }
        summary:
          type: string
          description: "headline + up to 3 finding sentences + ' Collected {yyyy-MM-dd} from {sourceSystem} for {application} (v{n}); integrity {intact | NOT intact | unverifiable}; {current | stale}.'"
        groundedOn:
          type: array
          items: { type: string }
          description: 'One line per fact: "{label}: {value} [{pointer}]".'
        generatedAt: { type: string, format: date-time }
        method: { type: string, enum: [DETERMINISTIC_RULES] }
        version: { type: integer, description: "The evidence version summarised (the current one unless ?version= was given)." }
        sha256: { type: string, description: "SHA-256 recorded for that version." }
        contentKind:
          type: string
          description: Detected from the stored bytes, not from the declared type or file name.
          enum: [CHECK_BUNDLE, INTEGRATION_OBJECT, QUERY_RESULT, STRUCTURED_DATA, TEXT, DOCUMENT, IMAGE, BINARY, UNAVAILABLE]
        verdict:
          type: string
          description: Worst-of over the persisted check results (FAIL > WARNING > PASS > NOT_APPLICABLE); NOT_ASSESSED when there are none.
          enum: [PASS, WARNING, FAIL, NOT_APPLICABLE, NOT_ASSESSED]
        headline:
          type: string
          description: '"{controlName} ({controlId}, {frameworkLabel}) — {verdictWord}. {contentSentence}"'
        control: { $ref: "#/components/schemas/EvidenceSummaryControl" }
        checks:
          type: array
          description: Persisted check results, sorted by checkId. Never evaluated by this call.
          items: { $ref: "#/components/schemas/EvidenceSummaryCheck" }
        facts:
          type: array
          description: At most 60. Each has a pointer, or "record" for record-level facts.
          items: { $ref: "#/components/schemas/EvidenceSummaryFact" }
        findings:
          type: array
          description: Most severe first.
          items: { $ref: "#/components/schemas/EvidenceSummaryFinding" }
        health: { $ref: "#/components/schemas/EvidenceSummaryHealth" }
        limits:
          type: array
          items: { type: string }
          description: What the summary could not do (truncated read, unreadable content, stale check results, fact cap, ...).

    EvidenceSummaryReport:
      type: object
      description: Body of GET /api/v1/reports/evidence-summary (JSON).
      properties:
        generatedAt: { type: string, format: date-time }
        scope:
          type: object
          properties:
            applicationSlug: { type: string, nullable: true }
            framework: { type: string, nullable: true }
        totals:
          type: object
          properties:
            controlsExpected: { type: integer }
            controlsWithEvidence: { type: integer, description: Expected controls that are COVERED or STALE. }
            controlsMissing: { type: integer }
            evidenceRecords: { type: integer, description: Evidence items listed in this report. }
            byVerdict:
              type: object
              description: Evidence items per verdict; all five keys are always present.
              properties:
                PASS: { type: integer }
                WARNING: { type: integer }
                FAIL: { type: integer }
                NOT_APPLICABLE: { type: integer }
                NOT_ASSESSED: { type: integer }
            stale: { type: integer, description: Evidence items whose freshness is STALE. }
            integrityMismatch: { type: integer }
        truncated: { type: boolean, description: True when the evidence cap was reached. }
        limits: { type: array, items: { type: string } }
        controls:
          type: array
          description: Ordered by application, framework, controlId. Expected controls with no evidence are listed as MISSING.
          items:
            type: object
            properties:
              application: { type: string }
              framework: { type: string }
              controlId: { type: string }
              controlName: { type: string }
              description: { type: string, nullable: true }
              status: { type: string, enum: [COVERED, STALE, MISSING], description: From the expected-control completeness. }
              verdict:
                type: string
                nullable: true
                enum: [PASS, WARNING, FAIL, NOT_APPLICABLE, NOT_ASSESSED]
                description: Worst-of over the control's evidence; null for MISSING controls.
              evidenceCount: { type: integer }
              latestCollectedAt: { type: string, format: date-time, nullable: true }
              evidence:
                type: array
                items:
                  type: object
                  properties:
                    evidenceId: { type: string, format: uuid }
                    version: { type: integer }
                    headline: { type: string }
                    verdict: { type: string, enum: [PASS, WARNING, FAIL, NOT_APPLICABLE, NOT_ASSESSED] }
                    collectedAt: { type: string, format: date-time, nullable: true }
                    integrity: { type: string, enum: [INTACT, MISMATCH, UNVERIFIABLE] }
                    freshness: { type: string, enum: [CURRENT, STALE] }

    EvidenceSummaryControl:
      type: object
      properties:
        controlId: { type: string }
        name: { type: string, description: "Control title from the control catalog; the control id when unknown." }
        description: { type: string, nullable: true, description: "Verbatim ECS Control Library description; a legacy control falls back to its title; null when unknown." }
        framework: { type: string }
        source: { type: string, enum: [LEGACY, LIBRARY, UNKNOWN] }
        alsoSatisfies:
          type: array
          description: Other frameworks this evidence is mapped to (same control code), from the existing framework mapping.
          items:
            type: object
            properties:
              framework: { type: string }
              controlId: { type: string }
              name: { type: string }

    EvidenceSummaryCheck:
      type: object
      properties:
        checkId: { type: string }
        status: { $ref: "#/components/schemas/CheckStatus" }
        observed: { type: string, nullable: true }
        expected: { type: string, nullable: true }
        detail: { type: string, nullable: true }

    EvidenceSummaryFact:
      type: object
      properties:
        label: { type: string }
        value: { type: string, maxLength: 200, description: "Truncated at 200 characters with an ellipsis; secrets are shown as [REDACTED]." }
        pointer: { type: string, description: "'JSON Pointer (e.g. /findings/0/observed), \"line N\", \"row N\", \"page N\", or \"record\".'" }

    EvidenceSummaryFinding:
      type: object
      properties:
        severity: { type: string, enum: [INFO, WARNING, FAIL] }
        message: { type: string }
        pointer: { type: string }

    EvidenceSummaryHealth:
      type: object
      description: Recomputed on every call (never cached).
      properties:
        integrity: { type: string, enum: [INTACT, MISMATCH, UNVERIFIABLE], description: "Same check as GET /evidence/{id}/verify." }
        collectedAt: { type: string, format: date-time, nullable: true }
        ageDays: { type: integer, nullable: true }
        freshness: { type: string, enum: [CURRENT, STALE], description: "Same definition as evidence completeness (age <= stale-after-days is CURRENT)." }
        lifecycleState: { type: string }
        versionCount: { type: integer }
        missingTags: { type: array, items: { type: string }, description: "Expected canonical tags (EvidenceNaming) that are absent." }

    NlQueryResult:
      type: object
      properties:
        question: { type: string }
        interpretedAs: { type: string }
        matchedQuery: { type: string }
        answer: { type: object, additionalProperties: true }
        narrative: { type: string }
        model: { type: string }
        simulated: { type: boolean }
        generatedAt: { type: string, format: date-time }

    FrameworkPosture:
      type: object
      properties:
        framework: { type: string }
        expected: { type: integer }
        compliant: { type: integer }
        partiallyCompliant: { type: integer }
        nonCompliant: { type: integer }
        notAssessed: { type: integer }
        missingEvidence: { type: integer }
        compliancePct: { type: number }

    ControlPosture:
      type: object
      properties:
        framework: { type: string }
        controlId: { type: string }
        status:
          type: string
          enum: [COMPLIANT, PARTIALLY_COMPLIANT, NON_COMPLIANT, NOT_ASSESSED, MISSING_EVIDENCE]
        detail: { type: string }
        openObservations: { type: integer, default: 0, description: "Open audit observations on this control for the application" }

    ComplianceReport:
      type: object
      properties:
        applicationSlug: { type: string }
        generatedAt: { type: string, format: date-time }
        expected: { type: integer }
        compliant: { type: integer }
        compliancePct: { type: number }
        byFramework: { type: array, items: { $ref: "#/components/schemas/FrameworkPosture" } }
        controls: { type: array, items: { $ref: "#/components/schemas/ControlPosture" } }

    AppPosture:
      type: object
      properties:
        applicationSlug: { type: string }
        name: { type: string }
        criticality: { type: string }
        expected: { type: integer }
        compliant: { type: integer }
        compliancePct: { type: number }
        covered: { type: integer }
        missing: { type: integer }
        completenessPct: { type: number }
        nonCompliant: { type: integer }
        missingEvidence: { type: integer }

    LeadershipDashboard:
      type: object
      description: Use Case 11 — portfolio rollup of actual compliance + completeness results across all applications.
      properties:
        generatedAt: { type: string, format: date-time }
        applications: { type: integer }
        expected: { type: integer }
        compliant: { type: integer }
        compliancePct: { type: number }
        covered: { type: integer }
        stale: { type: integer }
        missing: { type: integer }
        completenessPct: { type: number }
        checkVerdicts:
          type: object
          additionalProperties: { type: integer }
          description: Actual persisted check-verdict tally (PASS / WARNING / FAIL / NOT_APPLICABLE) across the estate.
        byApplication: { type: array, items: { $ref: "#/components/schemas/AppPosture" } }
        byFramework: { type: array, items: { $ref: "#/components/schemas/FrameworkPosture" } }

    ComparisonReport:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        framework: { type: string, nullable: true }
        applications: { type: array, items: { type: string } }
        frameworks:
          type: array
          items:
            type: object
            properties:
              framework: { type: string }
              compliancePctByApp: { type: object, additionalProperties: { type: number } }
              minPct: { type: number }
              maxPct: { type: number }
              spreadPct: { type: number }
        controls:
          type: array
          items:
            type: object
            properties:
              framework: { type: string }
              controlId: { type: string }
              statusByApp: { type: object, additionalProperties: { type: string } }
              consistent: { type: boolean }
        gaps:
          type: array
          items:
            type: object
            properties:
              applicationSlug: { type: string }
              framework: { type: string }
              controlId: { type: string }
              status: { type: string }

    GroupPosture:
      type: object
      properties:
        key: { type: string }
        applications: { type: integer }
        expected: { type: integer }
        compliant: { type: integer }
        compliancePct: { type: number }
        completenessPct: { type: number }

    EnterpriseDashboard:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        portfolio: { $ref: "#/components/schemas/LeadershipDashboard" }
        byBusinessUnit: { type: array, items: { $ref: "#/components/schemas/GroupPosture" } }
        byCriticality: { type: array, items: { $ref: "#/components/schemas/GroupPosture" } }
        topRisks: { type: array, items: { $ref: "#/components/schemas/AppPosture" } }

    NationalDashboard:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        nationalCompliancePct: { type: number }
        nationalCompletenessPct: { type: number }
        applications: { type: integer }
        regions:
          type: array
          items:
            type: object
            properties:
              region: { type: string }
              applications: { type: array, items: { type: string } }
              expected: { type: integer }
              compliant: { type: integer }
              compliancePct: { type: number }
              completenessPct: { type: number }
              rag: { type: string, enum: [GREEN, AMBER, RED] }

    NationalRollup:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        nationalCompliancePct: { type: number }
        nationalCompletenessPct: { type: number }
        applications: { type: integer }
        byRegionFramework:
          type: array
          items:
            type: object
            properties:
              region: { type: string }
              framework: { type: string }
              expected: { type: integer }
              compliant: { type: integer }
              compliancePct: { type: number }
        laggingRegions:
          type: array
          description: Regions ranked furthest-behind first; gapVsNationalPct is negative when the region trails the national average.
          items:
            type: object
            properties:
              region: { type: string }
              compliancePct: { type: number }
              gapVsNationalPct: { type: number }
              rag: { type: string, enum: [GREEN, AMBER, RED] }
        portfolio: { $ref: "#/components/schemas/LeadershipDashboard" }
        regions: { $ref: "#/components/schemas/NationalDashboard/properties/regions" }
        byBusinessUnit: { type: array, items: { $ref: "#/components/schemas/GroupPosture" } }
        byCriticality: { type: array, items: { $ref: "#/components/schemas/GroupPosture" } }
        topRisks: { type: array, items: { $ref: "#/components/schemas/AppPosture" } }

    AuditPrepReport:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        scope: { type: string }
        readinessScore: { type: number }
        totalFindings: { type: integer }
        bySeverity: { type: object, additionalProperties: { type: integer } }
        findings:
          type: array
          items:
            type: object
            properties:
              category: { type: string }
              severity: { type: string, enum: [HIGH, MEDIUM, LOW] }
              applicationSlug: { type: string }
              framework: { type: string }
              controlId: { type: string }
              detail: { type: string }
              action: { type: string }
        narrative: { type: string }
        model: { type: string }
        simulated: { type: boolean }

    TrendPoint:
      type: object
      properties:
        takenAt: { type: string, format: date-time }
        expected: { type: integer }
        compliant: { type: integer }
        compliancePct: { type: number }
        completenessPct: { type: number }
        approvedEvidence: { type: integer }
        openFindings: { type: integer }

    TrendReport:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        current:
          allOf: [ { $ref: "#/components/schemas/TrendPoint" } ]
          description: Live portfolio rollup (headline figure) — not the last, possibly synthetic, snapshot.
        points: { type: array, items: { $ref: "#/components/schemas/TrendPoint" } }
        closure:
          type: object
          properties:
            approvals: { type: integer }
            rejections: { type: integer }
            resubmissions: { type: integer }
            avgDaysToApprove: { type: number, nullable: true }
            approvalsByWeek: { type: object, additionalProperties: { type: integer } }
            rejectionTrendPct:
              type: number
              nullable: true
              description: Month-over-month % change in rejection count; null with fewer than 2 months of data.
        collection:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              ingested: { type: integer }
              duplicates: { type: integer }
              failed: { type: integer }

    EvidenceLifecycleSummary:
      type: object
      description: "App Owner dashboard — evidence lifecycle counts, rejection audit trail and computed Auditor SLA / pending-aging metrics, scoped to one application."
      properties:
        applicationSlug: { type: string }
        generatedAt: { type: string, format: date-time }
        counts:
          type: object
          properties:
            draft: { type: integer }
            submitted: { type: integer }
            approved: { type: integer }
            rejected: { type: integer }
            expired: { type: integer }
            superseded: { type: integer }
            archived: { type: integer, description: "ARCHIVED (retention); the seven values sum to total" }
        rejections:
          type: array
          items:
            type: object
            properties:
              evidenceId: { type: string, format: uuid }
              applicationSlug: { type: string }
              framework: { type: string }
              controlId: { type: string }
              reason: { type: string, nullable: true }
              rejectedBy: { type: string, nullable: true }
              rejectedAt: { type: string, format: date-time }
              workflowState: { type: string, description: "Draft | Submitted | Re-upload Requested | Closed" }
        auditorSla:
          type: object
          description: Computed — no direct backend source. % of reviewed evidence (approved or rejected) reviewed within `targetDays` of submission.
          properties:
            reviewedWithinTarget: { type: integer }
            totalReviewed: { type: integer }
            pct: { type: number, nullable: true }
            targetDays: { type: integer }
        pendingAging:
          type: object
          description: Computed — DRAFT/SUBMITTED evidence aging in the review queue.
          properties:
            count: { type: integer }
            avgDaysInQueue: { type: number, nullable: true }

    ReportInfo:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        formats: { type: array, items: { type: string } }
        params: { type: array, items: { type: string } }

    CreateScheduleRequest:
      type: object
      required: [name, sourceSystem, application, evidenceType, frequency]
      properties:
        name: { type: string }
        sourceSystem: { type: string, description: "A source from GET /scheduler/sources" }
        application: { type: string, description: "Onboarded application slug" }
        evidenceType: { type: string }
        frequency: { type: string, enum: [HOURLY, DAILY, WEEKLY, MINUTELY], description: "MINUTELY = every minute (testing)" }
        createdBy: { type: string }

    ScheduleOptions:
      type: object
      properties:
        sources: { type: array, items: { type: string } }
        applications: { type: array, items: { type: string } }
        evidenceTypes: { type: array, items: { type: string } }
        frequencies: { type: array, items: { type: string } }

    ScheduleView:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sourceSystem: { type: string }
        application: { type: string }
        evidenceType: { type: string }
        frequency: { type: string, enum: [HOURLY, DAILY, WEEKLY, MINUTELY], description: "MINUTELY = every minute (testing)" }
        active: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        nextRunAt: { type: string, format: date-time, nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, format: int64, description: "Optimistic-lock version; send it back on PATCH to detect a concurrent change" }

    RetentionPolicy:
      type: object
      properties:
        retentionDays: { type: integer }
        updatedBy: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, format: int64, nullable: true, description: "null until a policy has been saved" }

    RetentionRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        mode: { type: string, enum: [PREVIEW, EXECUTE] }
        triggeredBy: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        retentionDays: { type: integer }
        application: { type: string, nullable: true }
        scanned: { type: integer }
        archived: { type: integer }
        skipped: { type: integer, description: "in scope but not eligible (already archived or still within retention)" }

    ArchiveResult:
      type: object
      properties:
        runId: { type: string, format: uuid }
        mode: { type: string }
        retentionDays: { type: integer }
        application: { type: string, nullable: true }
        scanned: { type: integer }
        eligible: { type: integer }
        archived: { type: integer }
        skipped: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              evidenceId: { type: string, format: uuid }
              applicationSlug: { type: string }
              controlId: { type: string }
              framework: { type: string }
              collectedAt: { type: string, format: date-time }
              expiresAt: { type: string, format: date-time }

    DashboardKpis:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        filters:
          type: object
          properties:
            application: { type: string, nullable: true }
            framework: { type: string, nullable: true }
            collectionMethod: { type: string, nullable: true }
            from: { type: string, format: date-time, nullable: true }
            to: { type: string, format: date-time, nullable: true }
        evidence:
          type: object
          properties:
            total: { type: integer }
            counts:
              type: object
              description: Per persisted lifecycle state; the six values sum to total
              properties:
                draft: { type: integer }
                submitted: { type: integer }
                approved: { type: integer }
                rejected: { type: integer }
                expired: { type: integer }
                superseded: { type: integer }
            archived: { type: integer, description: "ARCHIVED (retention); the seven values sum to total" }
            closed: { type: integer, description: "approved + expired + superseded" }
            closureRatePct: { type: number, nullable: true, description: "closed / total; null when total = 0" }
            rejected: { type: integer, description: "re-upload requested" }
            expiringSoon: { type: integer, description: "retention expires within 30 days (not yet expired)" }
            expired: { type: integer, description: "past the retention window" }
            retentionDays: { type: integer }
            avgReviewTimeDays: { type: number, nullable: true, description: "submitted -> reviewed, from lifecycle events; null if none reviewed" }
            auditorSla:
              type: object
              nullable: true
              description: Reviewed evidence within the configured auditor target; pct is null when nothing was reviewed
              properties: { reviewedWithinTarget: { type: integer }, totalReviewed: { type: integer }, pct: { type: number, nullable: true }, targetDays: { type: integer } }
            pendingAging:
              type: object
              properties: { count: { type: integer }, avgDaysInQueue: { type: number, nullable: true } }
        automated:
          type: object
          properties:
            totalRuns: { type: integer }
            scheduledRuns: { type: integer }
            manualRuns: { type: integer }
            bulkRuns: { type: integer }
            completed: { type: integer }
            partial: { type: integer }
            failed: { type: integer }
            inProgress: { type: integer }
            successRatePct: { type: number, nullable: true, description: "completed / (completed + partial + failed)" }
            evidenceIngested: { type: integer, format: int64 }
            duplicatesSkipped: { type: integer, format: int64 }
            lastRun:
              type: object
              nullable: true
              properties:
                runId: { type: string, format: uuid }
                status: { type: string }
                at: { type: string, format: date-time }
                scheduleName: { type: string, nullable: true }
            activeSchedules: { type: integer }
            nextDueAt: { type: string, format: date-time, nullable: true }
            runsWithinSla: { type: integer }
            runsBreached: { type: integer }
            slaSeconds: { type: integer }
            openObservations: { type: integer, format: int64 }
            unreadNotifications: { type: integer, format: int64, description: "for the caller's X-Pramaan-Role" }

    ObservationView:
      type: object
      properties:
        id: { type: string, format: uuid }
        evidenceId: { type: string, format: uuid }
        controlId: { type: string }
        framework: { type: string }
        application: { type: string }
        text: { type: string, maxLength: 1000 }
        status: { type: string, enum: [OPEN, CLOSED] }
        raisedByRole: { type: string }
        raisedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }

    SecurityEventView:
      type: object
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        eventType: { type: string, enum: [ACCESS_DENIED, UNKNOWN_ROLE, INPUT_REJECTED, INVALID_IDENTIFIER] }
        outcome: { type: string, enum: [BLOCKED] }
        role: { type: string, nullable: true }
        actor: { type: string, nullable: true, description: "X-Pramaan-User, sanitized" }
        method: { type: string }
        path: { type: string }
        detail: { type: string, maxLength: 300 }
        remoteAddr: { type: string, nullable: true }

    NotificationView:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        type: { type: string, enum: [RUN_COMPLETED, RUN_PARTIAL, RUN_FAILED] }
        severity: { type: string, enum: [INFO, WARNING, ERROR] }
        title: { type: string }
        message: { type: string, description: "Run id, trigger, schedule, counts and (failures) per-source errorCode - message" }
        runId: { type: string, format: uuid, nullable: true }
        scheduleName: { type: string, nullable: true }
        recipientRole: { type: string }
        channel: { type: string, enum: [IN_APP, EMAIL_SIMULATED], description: "EMAIL_SIMULATED rows are delivery records only (created read)" }
        readAt: { type: string, format: date-time, nullable: true }

    NotificationList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NotificationView" } }
        unreadCount: { type: integer, format: int64 }

    NotificationSettings:
      type: object
      properties:
        enabled: { type: boolean, default: true }
        notifyOnSuccess: { type: boolean, default: true }
        notifyOnFailure: { type: boolean, default: true }
        recipientRoles: { type: array, items: { type: string, enum: [APP, AUDITOR, FH, VH, CIO, ADMIN] }, default: [APP, ADMIN] }
        emailSimulated: { type: boolean, default: true }
        version: { type: integer, format: int64, nullable: true, description: "Optimistic-lock version (read-only unless sent back on PUT)" }

    SourceConnectionView:
      type: object
      properties:
        sourceSystem: { type: string }
        status: { type: string, enum: [VALID, INVALID, DISABLED] }
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { type: string, nullable: true }

    RunRequest:
      type: object
      properties:
        applications: { type: array, items: { type: string } }
        frameworks: { type: array, items: { type: string } }
        sources: { type: array, items: { type: string } }
        requestedBy: { type: string }

    RunView:
      type: object
      properties:
        runId: { type: string, format: uuid }
        trigger: { type: string, enum: [MANUAL, SCHEDULED, BULK] }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, PARTIAL, FAILED], description: "PARTIAL = some sources failed; FAILED = all failed (or nothing ingested)" }
        requestedBy: { type: string }
        applications: { type: array, items: { type: string } }
        frameworks: { type: array, items: { type: string } }
        sources: { type: array, items: { type: string } }
        received: { type: integer }
        ingested: { type: integer }
        duplicates: { type: integer }
        failed: { type: integer }
        message: { type: string }
        perSource: { type: object, additionalProperties: { type: string } }
        sourceStatus: { type: object, additionalProperties: { type: string, enum: [CONNECTED, FAILED] }, description: "Per-source connectivity (source polled without error)" }
        scheduleId: { type: string, format: uuid, nullable: true, description: "Schedule that started this run; null for manual runs" }
        scheduleName: { type: string, nullable: true }
        retryOfRunId: { type: string, format: uuid, nullable: true, description: "Original run when started via Retry" }
        triggeredBy: { type: string, description: "X-Pramaan-User of the actor (attribution only), 'anonymous' if absent, 'system:scheduler' for tick runs; null on rows from before V17" }
        scheduleFrequency: { type: string, nullable: true }
        scheduleCreatedBy: { type: string, nullable: true }
        durationMs: { type: integer, format: int64, nullable: true, description: "finishedAt - startedAt" }
        slaSeconds: { type: integer, description: "Configured SLA (pramaan.scheduler.sla-seconds, default 60) for request-to-finish time" }
        queuedMs: { type: integer, format: int64, nullable: true, description: "Queue wait: startedAt - createdAt; null until the run starts" }
        slaStatus: { type: string, enum: [WITHIN_SLA, BREACHED, RUNNING], description: "Computed from createdAt -> finishedAt (queue wait + execution); RUNNING until finished" }
        sourceResults:
          type: array
          description: Per-source audit rows
          items:
            type: object
            properties:
              source: { type: string }
              status: { type: string, enum: [CONNECTED, FAILED] }
              evidenceCount: { type: integer, description: ingested }
              errorCode: { type: string, nullable: true }
              errorMessage: { type: string, nullable: true }
        sourceErrors:
          type: object
          description: Failed sources only (AUTH_FAILED, CONNECTION_DISABLED, UNKNOWN_SOURCE, COLLECT_FAILED)
          additionalProperties:
            type: object
            properties: { errorCode: { type: string }, errorMessage: { type: string } }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }

    # ---- Use Case 1 — evidence context ----
    EvidenceContext:
      type: object
      properties:
        evidenceId: { type: string, format: uuid }
        applicationSlug: { type: string }
        controlId: { type: string }
        technology: { type: string }
        collectionMethod: { type: string }
        sourceSystem: { type: string }
        collectedAt: { type: string, format: date-time, nullable: true }
        currentVersion: { type: integer }
        satisfiesControls: { type: array, items: { type: string } }
        frameworks: { type: array, items: { type: string } }
